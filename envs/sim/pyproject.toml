[project]
name = "td-vla-sim-env"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "td-vla", "torch==2.7.1", "torchvision==0.22.1", "numpy==1.26.4",
  "sapien==3.0.0b1", "mplib==0.2.1", "scipy==1.10.1", "transforms3d==0.4.2",
  "gymnasium==0.29.1", "trimesh==4.4.3", "open3d==0.18.0", "ipywidgets==8.1.5", "imageio==2.34.2",
  "huggingface-hub==0.36.2", "h5py==3.12.1", "zarr==2.18.3",
  "numcodecs==0.13.1", "pyglet==1.5.31", "moviepy==1.0.3", "toppra==0.6.3",
  "pydantic==2.10.6", "av==12.3.0", "matplotlib==3.8.4", "termcolor==2.5.0",
  "opencv-python==4.11.0.86", "pyyaml==6.0.2", "ffmpeg-python==0.2.0",
  "websockets==15.0.1", "msgpack==1.1.2", "typing-extensions>=4.12",
  "setuptools==75.8.0", "ninja==1.11.1.4", "wheel==0.45.1",
  "pybind11==2.13.6", "numpy-quaternion==2023.0.4", "setuptools-scm==8.2.0",
  "warp-lang==1.9.1", "importlib-resources==6.5.2", "scikit-image==0.24.0",
  "yourdfpy==0.0.56", "einops==0.8.1", "omegaconf==2.3.0", "lxml==5.3.1",
]

[tool.uv]
package = false
required-version = "==0.11.28"

[tool.uv.sources]
td-vla = { path = "../..", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
