[project]
name = "td-vla-policy-env"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "td-vla", "turbovla", "torch==2.7.1", "torchvision==0.22.1",
  "numpy==1.26.4", "h5py==3.12.1", "transformers==4.57.1", "timm==1.0.25",
  "accelerate==1.5.2", "av==12.3.0", "msgpack==1.1.2",
  "numpydantic==1.6.9", "omegaconf==2.3.0", "opencv-python-headless==4.11.0.86",
  "pandas==2.2.3", "pyarrow==14.0.1", "pydantic==2.10.6",
  "rich==14.0.0", "safetensors==0.7.0", "tdigest==0.5.2.2",
  "wandb==0.19.11", "websockets==15.0.1", "einops==0.8.1",
  "huggingface-hub==0.36.2", "pytest==8.3.5", "setuptools==75.8.0", "ninja==1.11.1.4",
]

[tool.uv]
package = false
required-version = "==0.11.28"

[tool.uv.sources]
td-vla = { path = "../..", editable = true }
turbovla = { path = "../../external/TurboVLA", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
